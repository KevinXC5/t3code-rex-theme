  <g transform="translate(36, 92)">
    <rect width="336" height="122" rx="14" fill="#161A1F" stroke="rgba(255,255,255,0.08)"/>
    <text x="18" y="28" fill="#8B949E" font-size="10.5" font-weight="700">TIER 1 · LOW / MINIMAL</text>
    <rect x="18" y="42" width="118" height="32" rx="8.5" fill="#1A2029" stroke="url(#lLow)" stroke-width="1.3"/>
