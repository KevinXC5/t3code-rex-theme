    <text x="18" y="28" fill="#BC8CFF" font-size="10.5" font-weight="700">TIER 5 · MAX</text>
    <rect x="18" y="42" width="118" height="32" rx="8.5" fill="#1A2029" stroke="url(#lMax)" stroke-width="1.3"/>
