    <text x="18" y="28" fill="#E3B341" font-size="10.5" font-weight="700">TIER 4 · EXTRA HIGH</text>
    <rect x="18" y="42" width="136" height="32" rx="8.5" fill="#1A2029" stroke="url(#lXhigh)" stroke-width="1.3"/>
