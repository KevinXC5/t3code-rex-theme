<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" width="1120" height="650" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D10"/>
      <stop offset="55%" stop-color="#0F1114"/>
      <stop offset="100%" stop-color="#131821"/>
    </linearGradient>
    <radialGradient id="paneGlow" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#2F81F7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1B1F23" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="activeTabGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.13)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.07)"/>
    </linearGradient>
    <linearGradient id="laserLow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#56D364"/>
      <stop offset="50%" stop-color="#3FB950"/>
      <stop offset="100%" stop-color="#39C5CF"/>
    </linearGradient>
    <linearGradient id="laserMed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79C0FF"/>
      <stop offset="50%" stop-color="#2F81F7"/>
      <stop offset="100%" stop-color="#56D4DD"/>
    </linearGradient>
    <linearGradient id="laserHigh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA198"/>
      <stop offset="50%" stop-color="#FF7B72"/>
      <stop offset="100%" stop-color="#F778BA"/>
    </linearGradient>
    <linearGradient id="laserXhigh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2CC60"/>
      <stop offset="50%" stop-color="#D29922"/>
      <stop offset="100%" stop-color="#FF9B70"/>
    </linearGradient>
    <linearGradient id="laserMax" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D2A8FF"/>
      <stop offset="50%" stop-color="#BC8CFF"/>
      <stop offset="100%" stop-color="#79C0FF"/>
    </linearGradient>
    <linearGradient id="laserHolo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#56D4DD"/>
      <stop offset="25%" stop-color="#58A6FF"/>
      <stop offset="50%" stop-color="#BC8CFF"/>
      <stop offset="75%" stop-color="#F778BA"/>
      <stop offset="100%" stop-color="#56D364"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.52"/>
    </filter>
    <filter id="glowMed" x="-25%" y="-35%" width="150%" height="170%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#58A6FF" flood-opacity="0.42"/>
    </filter>
    <filter id="glowHolo" x="-25%" y="-35%" width="150%" height="170%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#BC8CFF" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1120" height="650" rx="22" fill="url(#bgGrad)"/>

  <!-- Top Header -->
  <g transform="translate(44, 34)">
    <text x="0" y="24" fill="#E6EDF3" font-size="24" font-weight="700" letter-spacing="-0.4">Rex Theme for T3 Code</text>
    <text x="0" y="50" fill="#8B949E" font-size="13.5">Obsidian Sidebar · Inset Rounded Workspace Pane · Merino Dark / Light · Maple Mono NF CN</text>

    <!-- Swatch Pills on Top Right -->
    <g transform="translate(772, 6)">
      <rect x="0" y="0" width="96" height="32" rx="16" fill="#161A1F" stroke="rgba(255,255,255,0.11)"/>
      <circle cx="17" cy="16" r="6" fill="#0F1114" stroke="rgba(255,255,255,0.22)"/>
      <text x="31" y="20" fill="#E6EDF3" font-size="11.5" font-weight="600">#0F1114</text>

      <rect x="106" y="0" width="96" height="32" rx="16" fill="#161A1F" stroke="rgba(255,255,255,0.11)"/>
      <circle cx="123" cy="16" r="6" fill="#1B1F23" stroke="rgba(255,255,255,0.22)"/>
      <text x="137" y="20" fill="#E6EDF3" font-size="11.5" font-weight="600">#1B1F23</text>

      <rect x="212" y="0" width="96" height="32" rx="16" fill="#161A1F" stroke="rgba(88,166,255,0.38)"/>
      <circle cx="229" cy="16" r="6" fill="#2F81F7"/>
      <text x="243" y="20" fill="#79C0FF" font-size="11.5" font-weight="600">#2F81F7</text>
    </g>
  </g>

  <!-- Main Mockup Shell (Rex Two-Tier Frame) -->
  <g transform="translate(44, 108)" filter="url(#cardShadow)">
    <rect width="1032" height="500" rx="16" fill="#0F1114" stroke="rgba(255,255,255,0.10)"/>

    <!-- Left Obsidian Sidebar -->
    <g transform="translate(0, 0)">
      <!-- Traffic Lights + T3 [Code] Pill -->
      <circle cx="24" cy="24" r="5.5" fill="#FF5F56"/>
      <circle cx="42" cy="24" r="5.5" fill="#FFBD2E"/>
      <circle cx="60" cy="24" r="5.5" fill="#27C93F"/>

      <text x="90" y="28.5" fill="#E6EDF3" font-size="14" font-weight="700">T3</text>
      <rect x="112" y="13" width="48" height="21" rx="10.5" fill="rgba(47,129,247,0.16)" stroke="rgba(88,166,255,0.30)"/>
      <text x="120" y="27.5" fill="#58A6FF" font-size="11.5" font-weight="600">Code</text>

      <!-- Search + New Thread -->
      <rect x="14" y="48" width="184" height="32" rx="9" fill="#161A1F" stroke="rgba(255,255,255,0.08)"/>
      <text x="28" y="68" fill="#6E7681" font-size="12">Search threads...</text>
      <rect x="206" y="48" width="32" height="32" rx="9" fill="rgba(47,129,247,0.16)" stroke="rgba(88,166,255,0.28)"/>
      <path d="M222 57v14M215 64h14" stroke="#58A6FF" stroke-width="1.8" stroke-linecap="round"/>

      <!-- Active Frosted Glass Tab Pill (Rex Signature) -->
      <rect x="12" y="98" width="228" height="48" rx="10" fill="url(#activeTabGrad)" stroke="rgba(255,255,255,0.13)"/>
      <circle cx="30" cy="116" r="4" fill="#3FB950"/>
      <text x="42" y="120" fill="#E6EDF3" font-size="12.5" font-weight="600">zsh ~/AI-Work</text>
      <text x="42" y="136" fill="#8B949E" font-size="10.5">main · 127.0.0.1:7890</text>
      <path d="M225 113l-2.5 5.5 1.8.8-1 4.2 3.7-5.5-1.9-.7z" fill="#FF7B72"/>

      <!-- Inactive Rows -->
      <text x="26" y="170" fill="#8B949E" font-size="12">Refactor terminal renderer</text>
      <text x="26" y="186" fill="#6E7681" font-size="10.5">feat/blend-theme · 12m</text>

      <text x="26" y="216" fill="#8B949E" font-size="12">Merino Dark palette audit</text>
      <text x="26" y="232" fill="#6E7681" font-size="10.5">main · 2h</text>

      <text x="26" y="262" fill="#8B949E" font-size="12">Glass tab capsule strokes</text>
      <text x="26" y="278" fill="#6E7681" font-size="10.5">main · 1d</text>

      <!-- Bottom Shell Accent Strip -->
      <rect x="14" y="454" width="224" height="32" rx="9" fill="#14181E" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="30" cy="470" r="4" fill="#2F81F7"/>
      <text x="42" y="474" fill="#8B949E" font-size="11">Merino Dark · BlendTheme</text>
    </g>

    <!-- Right Inset Rounded Workspace Pane (Rex Signature Framed Card) -->
    <g transform="translate(250, 8)">
      <rect width="774" height="484" rx="12" fill="#1B1F23" stroke="rgba(255,255,255,0.11)"/>
      <rect width="774" height="484" rx="12" fill="url(#paneGlow)"/>

      <!-- Top Header inside Rounded Pane -->
      <path d="M0 12 Q0 0 12 0 H762 Q774 0 774 12 V42 H0 Z" fill="#181C21" opacity="0.92"/>
      <line x1="0" y1="42" x2="774" y2="42" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="22" cy="21" r="4" fill="#3FB950"/>
      <text x="34" y="25" fill="#E6EDF3" font-size="12.5" font-weight="600">t3code-rex-theme / New thread</text>
      <rect x="654" y="10" width="102" height="22" rx="6" fill="rgba(47,129,247,0.15)" stroke="rgba(88,166,255,0.28)"/>
      <text x="670" y="25" fill="#79C0FF" font-size="11" font-weight="600">Inset 12px</text>

      <!-- User Message Bubble -->
      <rect x="330" y="64" width="406" height="44" rx="14" fill="#22272F" stroke="rgba(255,255,255,0.09)"/>
      <text x="348" y="91" fill="#E6EDF3" font-size="13">Style T3 Code after Rex Terminal with a rounded inset pane.</text>

