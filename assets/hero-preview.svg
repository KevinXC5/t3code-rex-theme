      <rect x="44" y="182" width="692" height="106" rx="11" fill="#0D1117" stroke="rgba(255,255,255,0.09)"/>
      <rect x="44" y="182" width="692" height="28" rx="11" fill="#131820"/>
      <line x1="44" y1="210" x2="736" y2="210" stroke="rgba(255,255,255,0.07)"/>
      <text x="60" y="200" fill="#8B949E" font-size="11" font-weight="600" font-family="'Maple Mono NF CN', 'JetBrains Mono', monospace">zsh · ~/AI-Work</text>
      <text x="60" y="232" fill="#8B949E" font-size="12" font-family="'Maple Mono NF CN', 'JetBrains Mono', monospace">Last login: Tue Nov 17 20:07:30 on console</text>
      <text x="60" y="254" fill="#3FB950" font-size="12.5" font-weight="600" font-family="'Maple Mono NF CN', 'JetBrains Mono', monospace">~/AI-Work</text>
      <text x="142" y="254" fill="#BC8CFF" font-size="12.5" font-family="'Maple Mono NF CN', 'JetBrains Mono', monospace"> main</text>
      <text x="192" y="254" fill="#39C5CF" font-size="12.5" font-family="'Maple Mono NF CN', 'JetBrains Mono', monospace"> 127.0.0.1:7890</text>
      <text x="60" y="274" fill="#3FB950" font-size="12.5" font-weight="700" font-family="'Maple Mono NF CN', 'JetBrains Mono', monospace">&gt;</text>
      <rect x="74" y="262" width="8" height="15" rx="1.5" fill="#2F81F7"/>

      <!-- Floating Glass Composer Card -->
      <rect x="44" y="308" width="692" height="154" rx="16" fill="#22272E" stroke="rgba(88,166,255,0.44)"/>
      <text x="66" y="338" fill="#6E7681" font-size="13.5">Ask anything, @ files, $ skills, / commands</text>

      <!-- Effort Segmented Bar inside Preview -->
      <rect x="64" y="358" width="652" height="44" rx="10" fill="#131820" stroke="rgba(255,255,255,0.06)"/>
      <!-- Low -->
      <g transform="translate(72, 365)">
        <rect width="74" height="30" rx="7.5" fill="transparent"/>
        <circle cx="16" cy="15" r="4" fill="#3FB950"/>
        <text x="27" y="19" fill="#8B949E" font-size="11.5" font-weight="500">Low</text>
      </g>
      <!-- Medium (Active) -->
      <g transform="translate(154, 365)" filter="url(#glowMed)">
        <rect width="102" height="30" rx="7.5" fill="#1A2029" stroke="url(#laserMed)" stroke-width="1.3"/>
        <circle cx="16" cy="15" r="4" fill="#58A6FF"/>
        <text x="27" y="19" fill="#58A6FF" font-size="11.5" font-weight="600">Medium</text>
      </g>
      <!-- High -->
      <g transform="translate(264, 365)">
        <rect width="78" height="30" rx="7.5" fill="transparent"/>
        <circle cx="16" cy="15" r="4" fill="#FF7B72"/>
        <text x="27" y="19" fill="#8B949E" font-size="11.5" font-weight="500">High</text>
      </g>
      <!-- Extra High -->
      <g transform="translate(350, 365)">
        <rect width="106" height="30" rx="7.5" fill="transparent"/>
        <circle cx="16" cy="15" r="4" fill="#E3B341"/>
        <text x="27" y="19" fill="#8B949E" font-size="11.5" font-weight="500">Extra High</text>
      </g>
      <!-- Max -->
      <g transform="translate(464, 365)">
        <rect width="78" height="30" rx="7.5" fill="transparent"/>
        <circle cx="16" cy="15" r="4" fill="#BC8CFF"/>
        <text x="27" y="19" fill="#8B949E" font-size="11.5" font-weight="500">Max</text>
      </g>
      <!-- Ultra TURBO -->
      <g transform="translate(550, 365)" filter="url(#glowHolo)">
        <rect width="156" height="30" rx="7.5" fill="#1A2029" stroke="url(#laserHolo)" stroke-width="1.3"/>
        <path d="M18 8l-5 8h4l-.8 5 5.2-7.5h-4z" fill="url(#laserHolo)"/>
        <text x="30" y="19" fill="#EDF4FF" font-size="11.5" font-weight="600">Ultra</text>
        <rect x="68" y="8" width="42" height="14" rx="3.5" fill="url(#laserHolo)"/>
        <text x="73" y="18" fill="#0D1117" font-size="8" font-weight="800" font-style="italic">TURBO</text>
      </g>

      <!-- Composer Bottom Controls & Electric Sapphire Squircle Submit -->
      <text x="66" y="438" fill="#8B949E" font-size="12" font-weight="500">Gemini 4 Hydrogen</text>
      <rect x="192" y="421" width="90" height="24" rx="7" fill="#1A2029" stroke="url(#laserMed)" stroke-width="1.2"/>
      <circle cx="206" cy="433" r="3.5" fill="#58A6FF"/>
      <text x="216" y="437" fill="#58A6FF" font-size="11" font-weight="600">Medium</text>

      <!-- Squircle Submit Button -->
      <rect x="686" y="417" width="32" height="32" rx="10" fill="#2F81F7"/>
      <path d="M702 439v-12M697 432l5-5 5 5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
