      <text x="44" y="138" fill="#E6EDF3" font-size="14" font-weight="500">Applied the Rex Merino Dark palette with a 12px rounded workspace inset,</text>
      <text x="44" y="162" fill="#E6EDF3" font-size="14" font-weight="500">frosted obsidian sidebar pills, and embedded terminal-framed code blocks:</text>

